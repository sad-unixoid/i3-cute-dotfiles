# font_family      Hack
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

font_size 12
# Added by Gogh
active_border_color #ffffff
window_padding_width 10
include colors.conf
hide_window_decorations no
remember_window_size no
initial_window_width 89c
initial_window_height 26c
draw_minimal_borders yes
window_border_width 0.5px
active_border_color #ffffff
background_opacity 0.80

# audio
enable_audio_bell no


# BEGIN_KITTY_FONTS
font_family      family="AtkynsonMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
